<svg width="600" height="700" viewBox="0 0 600 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo -->
  <rect width="600" height="700" fill="#f9fafb"/>

  <!-- Libro/Mockup principal -->
  <g transform="translate(100, 100)">
    <!-- Sombra -->
    <rect x="10" y="10" width="380" height="480" rx="8" fill="#000000" opacity="0.1"/>

    <!-- Portada del libro -->
    <rect width="380" height="480" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>

    <!-- Banda amarilla -->
    <rect y="180" width="380" height="120" fill="#facc15"/>

    <!-- Texto decorativo -->
    <text x="190" y="60" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#000000">
      #NoTanMal
    </text>

    <!-- Título en banda amarilla -->
    <text x="190" y="230" font-family="Arial, sans-serif" font-size="32" font-weight="black" text-anchor="middle" fill="#000000">
      MANUAL DE
    </text>
    <text x="190" y="265" font-family="Arial, sans-serif" font-size="32" font-weight="black" text-anchor="middle" fill="#000000">
      SUPERVIVENCIA
    </text>

    <!-- Subtítulo -->
    <text x="190" y="380" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#666666">
      Para gente sensata
    </text>
    <text x="190" y="405" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#666666">
      en un mundo absurdo
    </text>
  </g>

  <!-- Elementos decorativos -->
  <circle cx="520" cy="150" r="30" fill="#facc15" opacity="0.3"/>
  <circle cx="80" cy="600" r="40" fill="#a855f7" opacity="0.2"/>
</svg>
